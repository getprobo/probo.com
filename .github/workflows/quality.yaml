name: "quality"

on:
  pull_request:
  push:
    branches:
      - "v2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          fetch-depth: 0
      - uses: "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1" # v7.1.0
        with:
          node-version: "24"
          cache: "npm"
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          repository: "getprobo/probo"
          path: "probo"
      - run: npm ci
      - run: npm run check:docs
      - run: npm run docs:check-reference
        env:
          PROBO_REPO_PATH: ${{ github.workspace }}/probo
      - run: npm run build
