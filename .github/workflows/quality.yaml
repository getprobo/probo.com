name: "quality"

on:
  pull_request:
  push:
    branches:
      - "v2"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0
      - uses: "actions/setup-node@v7.1.0"
        with:
          node-version: "24"
          cache: "npm"
      - uses: "actions/checkout@v7.0.1"
        with:
          repository: "getprobo/probo"
          path: "probo"
      - run: npm ci
      - run: npm run check:docs
      - run: npm run docs:check-reference
        env:
          PROBO_REPO_PATH: ${{ github.workspace }}/probo
      - run: npm run build

