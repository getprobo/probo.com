name: "trufflehog"

on:
  push:
    branches:
      - "v2"
  pull_request:

permissions:
  contents: read

jobs:
  scan:
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          fetch-depth: 0
      - uses: "trufflesecurity/trufflehog@v3.99.7"
        with:
          extra_args: "--results=verified,unknown"
